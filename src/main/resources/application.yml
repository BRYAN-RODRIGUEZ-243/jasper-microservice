server:
  port: ${PORT:1313}
  servlet:
    context-path: /

spring:
  application:
    name: jasper-microservice
  
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bd}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# Configuración de JasperReports
jasper:
  template:
    url: ${JASPER_TEMPLATE_URL:http://tu-servidor/ContratoClientes.jrxml}

# Actuator para health checks (necesario para Easypanel)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.jasper.microservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
