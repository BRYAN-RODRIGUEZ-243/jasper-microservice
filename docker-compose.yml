version: '3.8'

services:
  jasper-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jasper-microservice
    ports:
      - "1313:1313"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JASPER_TEMPLATE_URL=${JASPER_TEMPLATE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1313/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
